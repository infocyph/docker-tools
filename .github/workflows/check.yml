name: Check

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master", "develop", "development" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static and contract checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install static-check dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck php-cli

      - name: Validate shell syntax
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            bash -n "$file"
          done < <(find scripts -type f -name '*.sh' -print0)

      - name: ShellCheck critical errors
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find scripts -type f -name '*.sh' -print0)
          shellcheck --severity=error --shell=bash "${files[@]}"

      - name: Validate admin-panel PHP syntax
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file" >/dev/null
          done < <(find scripts/admin-panel -type f -name '*.php' -print0)

      - name: Existing helper smoke tests
        run: bash scripts/tests/senv-smoke.sh

      - name: Install actionlint
        env:
          GOBIN: ${{ runner.temp }}/bin
        run: |
          mkdir -p "$GOBIN"
          go install github.com/rhysd/actionlint/cmd/actionlint@latest

      - name: Lint workflows
        run: "${{ runner.temp }}/bin/actionlint"

  amd64:
    name: amd64 image smoke
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build amd64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          pull: true
          push: false
          tags: infocyph/tools:ci
          cache-from: type=gha,scope=check-amd64
          cache-to: type=gha,scope=check-amd64,mode=max

      - name: Verify image commands and generated metadata
        run: |
          docker run --rm --entrypoint bash infocyph/tools:ci -lc '
            command -v composer >/dev/null &&
            command -v mkcert >/dev/null &&
            command -v lazydocker >/dev/null &&
            command -v gitx >/dev/null &&
            command -v chromacat >/dev/null &&
            command -v sqlitex >/dev/null &&
            command -v netx >/dev/null &&
            command -v notifierd >/dev/null &&
            command -v php >/dev/null &&
            jq -e ".php.active | type == \"array\"" "$RUNTIME_VERSIONS_DB" >/dev/null &&
            jq -e ".node.active | type == \"array\"" "$RUNTIME_VERSIONS_DB" >/dev/null
          '

      - name: Admin-panel startup smoke
        run: |
          set -euo pipefail
          name="tools-ci-${RANDOM}"
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          docker run -d --name "$name" infocyph/tools:ci >/dev/null
          for _ in $(seq 1 30); do
            if docker exec "$name" sh -lc 'wget -qO- http://127.0.0.1:9911/ >/dev/null'; then
              docker exec "$name" pgrep -f notifierd >/dev/null
              exit 0
            fi
            sleep 1
          done
          docker logs "$name"
          exit 1

  arm64:
    name: arm64 image build
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build arm64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          pull: true
          push: false
          tags: infocyph/tools:ci-arm64
          cache-from: type=gha,scope=check-arm64
          cache-to: type=gha,scope=check-arm64,mode=max
