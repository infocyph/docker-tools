name: Check

on:
  push:
  pull_request:
    branches: [ "main", "master", "develop", "development" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static and contract checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install static-check dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck php-cli jq

      - name: Validate shell syntax
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            bash -n "$file"
          done < <(find scripts -type f -name '*.sh' -print0)

      - name: ShellCheck critical errors
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find scripts -type f -name '*.sh' -print0)
          shellcheck --severity=error --shell=bash "${files[@]}"

      - name: Validate admin-panel PHP syntax
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file" >/dev/null
          done < <(find scripts/admin-panel -type f -name '*.php' -print0)
          php -l scripts/tests/process-runner-smoke.php >/dev/null

      - name: Dependency and architecture contracts
        run: bash scripts/tests/dependency-contract.sh

      - name: Publication contracts
        run: bash scripts/tests/release-contract.sh

      - name: Control-plane hardening contracts
        run: bash scripts/tests/control-plane-hardening.sh

      - name: Env-store concurrency and corruption recovery
        run: bash scripts/tests/env-store-concurrency.sh

      - name: Bounded admin process runner
        run: php scripts/tests/process-runner-smoke.php

      - name: Install actionlint
        env:
          GOBIN: ${{ runner.temp }}/bin
        run: |
          mkdir -p "$GOBIN"
          go install github.com/rhysd/actionlint/cmd/actionlint@latest

      - name: Lint workflows
        run: "${{ runner.temp }}/bin/actionlint"

  amd64:
    name: amd64 image smoke
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build amd64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          pull: true
          push: false
          tags: infocyph/tools:ci
          cache-from: type=gha,scope=check-amd64
          cache-to: type=gha,scope=check-amd64,mode=max

      - name: Verify image commands and generated metadata
        run: |
          docker run --rm --entrypoint bash infocyph/tools:ci -lc '
            test "$(uname -m)" = "x86_64" &&
            command -v composer >/dev/null &&
            command -v mkcert >/dev/null &&
            command -v lazydocker >/dev/null &&
            command -v gitx >/dev/null &&
            command -v chromacat >/dev/null &&
            command -v sqlitex >/dev/null &&
            command -v netx >/dev/null &&
            command -v notifierd >/dev/null &&
            command -v tools-healthcheck >/dev/null &&
            command -v flock >/dev/null &&
            command -v php >/dev/null &&
            mkcert -version >/dev/null &&
            lazydocker --version >/dev/null &&
            gitx --version >/dev/null &&
            chromacat --version >/dev/null &&
            sqlitex --version >/dev/null &&
            netx --version >/dev/null &&
            jq -e ".php.active | type == \"array\" and length > 0" "$RUNTIME_VERSIONS_DB" >/dev/null &&
            jq -e ".node.active | type == \"array\" and length > 0" "$RUNTIME_VERSIONS_DB" >/dev/null
          '

      - name: SOPS environment helper smoke
        run: |
          docker run --rm --entrypoint bash infocyph/tools:ci -lc \
            'bash /etc/share/scripts/tests/senv-smoke.sh'

      - name: Tools health and admin lifecycle smoke
        run: |
          set -euo pipefail
          name="tools-ci-${RANDOM}"
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          docker run -d --name "$name" infocyph/tools:ci >/dev/null

          for _ in $(seq 1 30); do
            if docker exec "$name" tools-healthcheck >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          docker exec "$name" tools-healthcheck
          docker exec "$name" sh -lc 'tr "\0" " " </proc/1/cmdline | grep -q notifierd'

          admin_pid="$(docker exec "$name" cat /run/admin-panel.pid)"
          docker exec "$name" kill "$admin_pid"
          sleep 1

          if docker exec "$name" tools-healthcheck >/dev/null 2>&1; then
            echo 'Healthcheck remained green after enabled admin process died.' >&2
            exit 1
          fi

          docker exec "$name" sh -lc 'tr "\0" " " </proc/1/cmdline | grep -q notifierd'

      - name: Tools health without admin panel
        run: |
          set -euo pipefail
          name="tools-no-admin-${RANDOM}"
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          docker run -d --name "$name" -e ADMIN_PANEL_AUTOSTART=0 infocyph/tools:ci >/dev/null

          for _ in $(seq 1 30); do
            if docker exec "$name" tools-healthcheck >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          docker exec "$name" tools-healthcheck
          docker exec "$name" test ! -e /run/admin-panel.pid
          docker exec "$name" sh -lc 'tr "\0" " " </proc/1/cmdline | grep -q notifierd'

  arm64:
    name: arm64 image smoke
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build arm64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          load: true
          pull: true
          push: false
          tags: infocyph/tools:ci-arm64
          cache-from: type=gha,scope=check-arm64
          cache-to: type=gha,scope=check-arm64,mode=max

      - name: Verify arm64 native tools
        run: |
          docker run --rm --platform linux/arm64 --entrypoint bash infocyph/tools:ci-arm64 -lc '
            test "$(uname -m)" = "aarch64" &&
            command -v tools-healthcheck >/dev/null &&
            command -v flock >/dev/null &&
            mkcert -version >/dev/null &&
            lazydocker --version >/dev/null &&
            gitx --version >/dev/null &&
            chromacat --version >/dev/null &&
            sqlitex --version >/dev/null &&
            netx --version >/dev/null &&
            jq -e ".php.active | type == \"array\" and length > 0" "$RUNTIME_VERSIONS_DB" >/dev/null
          '
